{{ define "content" }}


<div id="pageTitle">Request</div>

<div x-data="data()">
    <form onsubmit="event.preventDefault()" autocomplete="off">
        <fieldset>
            <h3 class="text-lg font-medium leading-6 text-gray-900">GitHub Copilot Premium Budget Allocation</h3>
            
            <div class="flex  mt-5 flex-nowrap">
                <div class="basis-1/3 md:base-full md:flex-row mx-3 self-center">
                    <div class="flex flex-col pl-2 ml-3 mt-1 text-sm text-gray-900">
                        Organization
                    </div>
                </div>
                <div class="basis-2/3 md:base-full  md:flex-row mr-5 self-center">
                    <div x-data="combobox({
                            ajax: getOwnedOrganizations,
                            id : 'DatabaseId',
                            text : 'Login',
                            isInsertable : false,
                            isDisplayItem : false
                        })" x-modelable="selected" x-model="form.organization">
                        <div x-html="template"></div>
                    </div>
                </div>
            </div>
            <span class="text-xs text-gray-500 pl-8">Only owned organizations containing "-group-" or "-client-" are selectable.</span>
            <div class="flex flex flex-col md:flex-row  my-3 mt-5">
                <div class="basis-1/3 md:base-full md:flex-row mx-3 self-center">
                    <div class="flex flex-col pl-2 ml-3 mt-1 text-sm text-gray-900">
                        Amount
                    </div>
                </div>
                <div class="basis-2/3 md:base-full  md:flex-row mr-5 self-center">
                    <div class="flex items-center rounded-md bg-white px-3 outline outline-1 -outline-offset-1 outline-gray-300 focus-within:outline focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600">
                        <div class="shrink-0 select-none text-base text-gray-500 sm:text-sm/6 pr-3">$</div>
                        <input id="price" type="number" name="price" 
                            placeholder="100" aria-describedby="price-currency" x-model="form.amount"
                            class="block min-w-0 grow bg-white py-1.5 pl-1 pr-3 text-base text-gray-900 placeholder:text-gray-400 focus:outline focus:outline-0 sm:text-sm/6" />
                        <div id="price-currency" class="shrink-0 select-none text-base text-gray-500 sm:text-sm/6 pl-3">USD</div>
                    </div>
                </div>
            </div>
        </fieldset>
        <div class="flex mt-7 justify-end">
            <div align="right">
                <button type="submit" class="inline-flex justify-center py-2 px-4 rounded-md text-white"
                    x-bind:class="!isValid ? 'bg-orange-100' : 'bg-orange-500'" x-bind:disabled="!isValid" @click="submit()">
                    <span>Submit</span>
                </button>
            </div>
            <div class="ml-3">
                <button type="button" class="bg-orange-500  inline-flex justify-center py-2 px-4 rounded-md text-white"
                    @click="goto('/other-requests?view=copilot')">
                    <span>Cancel</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script src="/public/components/combobox.js"></script>

<script type="text/javascript">
    function data() {
        return {
            form: {
                organization: [],
                amount: 0
            },
            submit() {
                postData = {
                    organizationId: this.form.organization[0]["id"],
                    organizationLogin: this.form.organization[0]["text"],
                    amount: parseInt(this.form.amount, 10)  
                }
                Alpine.store('master').modal.reset()
                Alpine.store('master').modal.show()
                Alpine.store('master').postData(`/api/ghcp-premium-budget-allocation`, postData,
                    "Your request has been submitted.", "Go back", "/other-requests?view=ghcpPremiumBudgetAllocation")
            },
            get isValid() {
                if(this.form.organization.length > 0) {
                    return true
                }
                if(this.form.amount > 0) {
                    return true
                }
                return false
            },
            goto(url) {
                window.location.href = url
            }
        }
    }
    async function getOwnedOrganizations() {
        let uri = '/api/user/organizations/owned'
        let encoded = encodeURI(uri);
        const res = await fetch(encoded)
        const data = await res.json()
        return data
    }
</script>
{{ end }}
